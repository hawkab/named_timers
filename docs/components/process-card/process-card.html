<article class="process-card" data-role="process-card">
  <button class="process-card__body" type="button" data-action="select-process">
    <span class="process-card__name" data-role="name"></span>
    <span class="process-card__description" data-role="description"></span>
    <span class="process-card__meta" data-role="meta"></span>
  </button>
  <button class="process-card__delete" type="button" data-action="delete-process" aria-label="Delete process" title="Delete process">×</button>
</article>
