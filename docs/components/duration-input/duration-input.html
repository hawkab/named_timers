<div class="duration-input">
  <label class="duration-input__part">
    <span data-role="hours-label"></span>
    <input inputmode="numeric" min="0" max="999" step="1" type="number" data-role="hours">
  </label>
  <label class="duration-input__part">
    <span data-role="minutes-label"></span>
    <input inputmode="numeric" min="0" max="59" step="1" type="number" data-role="minutes">
  </label>
  <label class="duration-input__part">
    <span data-role="seconds-label"></span>
    <input inputmode="numeric" min="0" max="59" step="1" type="number" data-role="seconds">
  </label>
</div>
